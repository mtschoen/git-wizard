name: aislop
# Quality gate for AI-generated slop patterns (https://github.com/scanaislop/aislop).
# `aislop ci` scores the whole repo (0-100) and exits non-zero when the score
# drops below ci.failBelow (100) in .aislop/config.yml - gating the PR/push.
#
# The C# engine lives ONLY in the personal fork gitea.fleet.sticktoitive.net/
# schoen/aislop (the public npm `aislop` scores just the Python ci/ tooling),
# so we clone + build that fork at the commit pinned in .aislop/fork-commit
# and run the built CLI. Gitea is the canonical source - the pin is bumped by
# pushes that land there first - and github.com/mtschoen/aislop is a mirror
# that can lag behind, so a freshly bumped sha may not exist on GitHub yet.
# The C# lint engine shells out to the `roslynator` and `jb` (ReSharper CLT)
# dotnet global tools, so dotnet, roslynator, and jb are set up here, and the
# solution is restored so jb inspectcode can build it. The pin is bumped by
# the aislop fork's sync-consumers workflow via PR; a manual bump = edit
# .aislop/fork-commit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read aislop fork pin
        # Pinned by commit, not a published version - the registry publish
        # route is retired. The pin is bumped by the aislop fork's
        # sync-consumers workflow via PR; a manual bump = edit
        # .aislop/fork-commit directly. .aislop/fork-commit is modified by
        # external bump PRs by design, so validate it is exactly one 40-char
        # lowercase hex sha before it reaches GITHUB_ENV - an unvalidated
        # write would let a crafted file with embedded newlines inject
        # arbitrary env vars into later steps.
        run: |
          commit=$(tr -d '[:space:]' < .aislop/fork-commit)
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: .aislop/fork-commit is not a single 40-char lowercase sha" >&2
            exit 1
          fi
          echo "AISLOP_FORK_COMMIT=$commit" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the `npm install` below builds the fork via its
          # "prepare": "tsdown" script, and tsdown >= 0.22 requires node
          # ^22.18 || >=24.11 at build time (it calls Promise.withResolvers,
          # added in node 22). The pin below still predates that tsdown bump,
          # so 20 happens to work today - but bumping AISLOP_FORK_COMMIT past
          # aislop's upstream-0.14.1 merge on node 20 fails with
          # "Promise.withResolvers is not a function". aislop's own CI matrix
          # is 22/24. The built CLI still targets node18, so this is aislop's
          # build floor, not its runtime floor.
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install C# lint engines (roslynator + jb / ReSharper CLT)
        run: |
          dotnet tool update -g roslynator.dotnet.cli --version 0.12.0 --allow-downgrade
          dotnet tool update -g JetBrains.ReSharper.GlobalTools --version 2026.2.0 --allow-downgrade
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Build C#-capable aislop (pinned fork commit)
        # Cloned outside the workspace so aislop does not scan the fork's own source.
        # From Gitea (canonical, always current), not the github.com mirror (can lag
        # behind by many commits, so a freshly bumped pin can be absent there).
        # The fork is a pnpm workspace (packageManager pnpm@10.28.0 + pnpm-lock.yaml);
        # npm chokes on it on some npm versions, so install via pnpm through npx -y
        # (hermetic - no corepack or preinstalled pnpm needed).
        run: |
          git clone https://gitea.fleet.sticktoitive.net/schoen/aislop.git "$RUNNER_TEMP/aislop"
          git -C "$RUNNER_TEMP/aislop" checkout "$AISLOP_FORK_COMMIT"
          (cd "$RUNNER_TEMP/aislop" && npx -y pnpm@10.28.0 install --frozen-lockfile)
      # MFTLib types must resolve for jb/roslynator to load the solution; managed-only
      # is enough for analysis (no native build here - the copy target only warns).
      - name: Build MFTLib managed (HintPath for analysis)
        run: |
          dotnet build external/MFTLib/MFTLib/MFTLib.csproj -c Release -p:Platform=x64
          dotnet build external/MFTLib/MFTLibTestExtensions/MFTLibTestExtensions.csproj -c Release -p:Platform=x64
      - name: Build git-wizard (fully compiles the workspace for dotnet format)
        run: dotnet build git-wizard.slnx -c Release
      - name: aislop quality gate
        # Sanity-fail if the C# engine did not actually analyze the .cs tree (avoid a
        # silent Python-only pass): require a healthy file count alongside the score gate.
        run: |
          REPORT="$RUNNER_TEMP/aislop-report.json"
          node "$RUNNER_TEMP/aislop/dist/cli.js" ci . --json > "$REPORT" || GATE_FAILED=1
          node -e "const r=require(process.env.REPORT); const f=r.summary?.files??0; console.log('aislop score',r.score,'over',f,'files'); if(f<10){console.error('aislop only scanned '+f+' files - the C# engine did not run');process.exit(1);}"
          # On a failing score, print every finding so the log says WHY - a bare
          # score is undebuggable from a runner without shell access to $RUNNER_TEMP.
          if [ -n "$GATE_FAILED" ]; then
            node -e "const r=require(process.env.REPORT); for (const f of (r.diagnostics??[])) console.log([f.severity,f.rule,f.filePath+':'+(f.line??0),f.message].join(' | '));"
            echo "aislop score below failBelow"; exit 1
          fi
        env:
          REPORT: ${{ runner.temp }}/aislop-report.json
