name: aislop
# Quality gate for AI-generated slop patterns (https://github.com/scanaislop/aislop).
# `aislop ci` scores the whole repo (0-100) and exits non-zero when the score
# drops below ci.failBelow (100) in .aislop/config.yml - gating the PR/push.
#
# The C# engine lives ONLY in the personal fork gitea.fleet.sticktoitive.net/
# schoen/aislop (the public npm `aislop` scores just the Python ci/ tooling),
# so we clone + build that fork at the commit pinned in .aislop/fork-commit
# and run the built CLI. Gitea is the canonical source - the pin is bumped by
# pushes that land there first - and github.com/mtschoen/aislop is a mirror
# that can lag behind, so a freshly bumped sha may not exist on GitHub yet.
# Project-backed C# checks (compiler, Roslyn analyzers including the SDK CA rules
# and AsyncFixer under TreatWarningsAsErrors, dotnet format, and JetBrains
# InspectCode) run directly in ci.yml during normal build and
# verification, keeping this quality gate lightweight and fast. The pin is bumped
# by the aislop fork's sync-consumers workflow via PR; a manual bump = edit
# .aislop/fork-commit.
on:
  pull_request:
  push:
    # pr-crew merge train pushes its synthetic batch commit to this branch and polls this run's statuses before landing the batch.
    branches: [main, 'pr-crew/merge-train/**']
  workflow_dispatch:

# A newer commit on a pull request supersedes the run in flight. Every other run gets
# a group of its own: Gitea also cancels queued runs of a shared group whatever
# cancel-in-progress says, and a push to main gates the landing batch.
concurrency:
  group: aislop-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No submodules: external/MFTLib is excluded from the scan, and since the
        # project-backed C# tools moved to ci.yml nothing in this job builds it.
      - name: Read aislop fork pin
        # Pinned by commit, not a published version - the registry publish
        # route is retired. The pin is bumped by the aislop fork's
        # sync-consumers workflow via PR; a manual bump = edit
        # .aislop/fork-commit directly. .aislop/fork-commit is modified by
        # external bump PRs by design, so validate it is exactly one 40-char
        # lowercase hex sha before it reaches GITHUB_ENV - an unvalidated
        # write would let a crafted file with embedded newlines inject
        # arbitrary env vars into later steps.
        run: bash ci/aislop-gate.sh pin
      - name: Detect toolchain baked into the runner image
        id: baked
        if: runner.os != 'Windows'
        shell: bash
        run: bash ci/baked-toolchain.sh node
      - uses: actions/setup-node@v4
        if: steps.baked.outputs.node != 'true'
        with:
          # 22, not 20: the `npm install` below builds the fork via its
          # "prepare": "tsdown" script, and tsdown >= 0.22 requires node
          # ^22.18 || >=24.11 at build time (it calls Promise.withResolvers,
          # added in node 22). The pin below still predates that tsdown bump,
          # so 20 happens to work today - but bumping AISLOP_FORK_COMMIT past
          # aislop's upstream-0.14.1 merge on node 20 fails with
          # "Promise.withResolvers is not a function". aislop's own CI matrix
          # is 22/24. The built CLI still targets node18, so this is aislop's
          # build floor, not its runtime floor.
          node-version: 22
      - name: Restore the built aislop fork
        id: aislop-cache
        uses: actions/cache@v4
        with:
          # Keyed on the pinned sha, which is immutable, so a hit is always the
          # build for exactly this pin and the clone + install below is skipped.
          # The node major is in the key because the build runs under it.
          # receipt1 excludes older caches without a successful-build receipt.
          path: ${{ runner.temp }}/aislop
          key: aislop-fork-${{ env.AISLOP_FORK_COMMIT }}-node22-receipt1
      - name: Build C#-capable aislop (pinned fork commit)
        if: steps.aislop-cache.outputs.cache-hit != 'true'
        # Cloned outside the workspace so aislop does not scan the fork's own source.
        # From Gitea (canonical, always current), not the github.com mirror (can lag
        # behind by many commits, so a freshly bumped pin can be absent there).
        # The fork is a pnpm workspace (its package.json packageManager field + pnpm-lock.yaml);
        # npm chokes on it on some npm versions, so install via pnpm through npx -y
        # (hermetic - no corepack or preinstalled pnpm needed). The pnpm version is read
        # from the checkout's own packageManager field, so a pin bump that changes the
        # fork's pnpm needs no edit here.
        run: bash ci/aislop-gate.sh prepare
      - name: aislop quality gate
        # Sanity-fail if the C# engine did not actually analyze the .cs tree (avoid a
        # silent Python-only pass): require a healthy file count alongside the score gate.
        #
        # The scan runs backgrounded with a foreground heartbeat because its stdout is
        # redirected to $REPORT: with no log output, Gitea's zombie-task reaper
        # (ZOMBIE_TASK_TIMEOUT, 10 minutes) marks the task failed whenever a busy
        # runner stretches the scan past 10 silent minutes, even though the process
        # is healthy. The heartbeat keeps the task's log (and its updated stamp) alive.
        run: bash ci/aislop-gate.sh
        env:
          REPORT: ${{ runner.temp }}/aislop-report.json
