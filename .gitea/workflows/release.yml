name: Release

on:
  push:
    tags: ['v*']
  # PR publish-smoke: publishes all RIDs and creates+deletes a draft smoke release,
  # scoped to files that affect publishing.
  pull_request:
    paths:
      - '.gitea/workflows/release.yml'
      - 'GitWizard/GitWizard.csproj'
      - 'GitWizardUI/GitWizardUI.csproj'
      - 'git-wizard/git-wizard.csproj'
      - 'Directory.Build.targets'
      - '.gitmodules'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without leading v) - used for filenames when run manually'
        required: true
        default: '0.0.0-test'

jobs:
  publish-posix:
    name: Publish CLI + Avalonia (linux + osx)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, osx-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: linux-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            linux-nuget-

      # osx-x64 ships managed-only (no mac runner to build the native; the vendored era
      # shipped no osx native either). linux-x64 gets the CMake-built .so via the
      # CopyMFTLibNativeLinux target. The stray .so a linux host copies into the osx
      # publish is inert junk, accepted (the vendored era did the same with the win dll).
      - name: Build MFTLib (native + managed)
        run: |
          apt-get update && apt-get install -y cmake ninja-build g++ zip
          cmake -S external/MFTLib/MFTLibNative -B external/MFTLib/build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build external/MFTLib/build-linux
          dotnet build external/MFTLib/MFTLib/MFTLib.csproj -c Release -p:Platform=x64

      - name: Resolve version
        id: ver
        run: |
          case "${{ github.event_name }}" in
            push)         VERSION="${GITHUB_REF_NAME#v}" ;;
            pull_request) VERSION="0.0.0-pr-${GITHUB_SHA:0:7}" ;;
            *)            VERSION="${{ inputs.version }}" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Validate tag matches GitWizardUI <Version> (push only)
        if: github.event_name == 'push'
        run: |
          appVer=$(grep -oP '(?<=<Version>)[^<]+' GitWizardUI/GitWizardUI.csproj)
          tagVer="${{ steps.ver.outputs.version }}"
          if [ "$appVer" != "$tagVer" ]; then
            echo "Tag version '$tagVer' does not match GitWizardUI.csproj <Version> '$appVer'. Bump the csproj or move the tag." >&2
            exit 1
          fi
          echo "Version match: $tagVer"

      - name: Publish CLI
        run: |
          dotnet publish git-wizard/git-wizard.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/cli/${{ matrix.rid }}

      - name: Publish GUI (GitWizardUI)
        run: |
          dotnet publish GitWizardUI/GitWizardUI.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/gui/${{ matrix.rid }}

      - name: Zip artifacts
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          (cd publish/cli/${{ matrix.rid }} && zip -r "../../../artifacts/git-wizard-${VERSION}-${{ matrix.rid }}.zip" .)
          (cd publish/gui/${{ matrix.rid }} && zip -r "../../../artifacts/GitWizardUI-${VERSION}-${{ matrix.rid }}.zip" .)
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: posix-${{ matrix.rid }}
          path: artifacts/*.zip
          if-no-files-found: error

  publish-windows:
    name: Publish CLI + Avalonia (win-x64, native MFTLib)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build MFTLib (native + managed)
        shell: pwsh
        run: |
          msbuild external\MFTLib\MFTLibNative\MFTLibNative.vcxproj -t:Build -p:Configuration=Release -p:Platform=x64 -nologo -v:minimal
          dotnet build external\MFTLib\MFTLib\MFTLib.csproj -c Release -p:Platform=x64

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          switch ('${{ github.event_name }}') {
            'push'         { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
            'pull_request' { $version = "0.0.0-pr-$($env:GITHUB_SHA.Substring(0,7))" }
            default        { $version = '${{ inputs.version }}' }
          }
          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $version"

      - name: Publish CLI
        shell: pwsh
        run: |
          dotnet publish git-wizard/git-wizard.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/cli/win-x64

      - name: Publish GUI (GitWizardUI)
        shell: pwsh
        run: |
          dotnet publish GitWizardUI/GitWizardUI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/gui/win-x64

      - name: Zip artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/cli/win-x64/* -DestinationPath "artifacts/git-wizard-$version-win-x64.zip"
          Compress-Archive -Path publish/gui/win-x64/* -DestinationPath "artifacts/GitWizardUI-$version-win-x64.zip"
          Get-ChildItem artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-win-x64
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    name: Create Gitea release
    runs-on: ubuntu-latest
    needs: [publish-posix, publish-windows]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 15
    env:
      GITHUB_MIRROR_REPOSITORY: mtschoen/git-wizard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release identity
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            NAME="$GITHUB_REF_NAME"
            DRAFT=false
            DRY_RUN=false
            if [[ "$TAG" == *-* ]]; then PRE=true; else PRE=false; fi
          else
            SHA="${GITHUB_SHA:0:7}"
            TAG="smoke-pr${{ github.event.pull_request.number }}-${SHA}"
            NAME="smoke pr${{ github.event.pull_request.number }} (${SHA})"
            DRAFT=true
            DRY_RUN=true
            PRE=true
          fi
          {
            echo "tag=$TAG"
            echo "name=$NAME"
            echo "draft=$DRAFT"
            echo "prerelease=$PRE"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG name='$NAME' draft=$DRAFT dry_run=$DRY_RUN prerelease=$PRE"

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: downloaded

      - name: Stage assets
        run: |
          mkdir -p assets
          find downloaded -name '*.zip' -exec cp -v {} assets/ \;
          ls -la assets/

      # Check the mirror credential before mutating Gitea. A missing/revoked
      # token must not leave a Gitea-only release that cannot be retried cleanly.
      - name: Validate GitHub mirror credentials
        if: github.event_name == 'push'
        env:
          GITHUB_RELEASE_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}
        run: |
          if [ -z "$GITHUB_RELEASE_TOKEN" ]; then
            echo "::error::GITHUB_RELEASE_TOKEN is not configured in the Gitea repository's Actions secrets."
            exit 1
          fi
          curl -fsSL \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Authorization: token $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_MIRROR_REPOSITORY" > /dev/null

      - name: Create release
        id: create
        env:
          CI_GITEA_TOKEN: ${{ secrets.CI_GITEA_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          NAME: ${{ steps.ver.outputs.name }}
          DRAFT: ${{ steps.ver.outputs.draft }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
          DRY_RUN: ${{ steps.ver.outputs.dry_run }}
        run: |
          for value in "$DRAFT" "$PRERELEASE" "$DRY_RUN"; do
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "::error::Release boolean output was not a literal true or false: '$value'"
              exit 1
            fi
          done
          BODY=$(jq -nc \
            --arg tag "$TAG" \
            --arg name "$NAME" \
            --argjson draft "$DRAFT" \
            --argjson pre "$PRERELEASE" \
            --argjson dryrun "$DRY_RUN" \
            --arg target "$GITHUB_SHA" \
            'if $dryrun then
               {tag_name:$tag, name:$name, draft:$draft, prerelease:$pre, target_commitish:$target}
             else
               {tag_name:$tag, name:$name, draft:$draft, prerelease:$pre}
             end')
          RESPONSE=$(curl -fsSL -X POST \
            -H "Authorization: token $CI_GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://gitea.llamabox.sticktoitive.net/api/v1/repos/${GITHUB_REPOSITORY}/releases")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "Release id: $RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload assets
        env:
          CI_GITEA_TOKEN: ${{ secrets.CI_GITEA_TOKEN }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
        run: |
          shopt -s nullglob
          assets=(assets/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets were staged."
            exit 1
          fi
          for asset in "${assets[@]}"; do
            echo "Uploading $asset"
            curl -fsSL -X POST \
              -H "Authorization: token $CI_GITEA_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "https://gitea.llamabox.sticktoitive.net/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$(basename "$asset")"
          done

      - name: Mirror release to GitHub
        if: github.event_name == 'push' && steps.create.outputs.release_id != '' && steps.create.outputs.release_id != 'null'
        env:
          GITHUB_RELEASE_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          NAME: ${{ steps.ver.outputs.name }}
          DRAFT: ${{ steps.ver.outputs.draft }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          for value in "$DRAFT" "$PRERELEASE"; do
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "::error::GitHub release boolean output was not a literal true or false: '$value'"
              exit 1
            fi
          done
          BODY=$(jq -nc \
            --arg tag "$TAG" \
            --arg name "$NAME" \
            --argjson draft "$DRAFT" \
            --argjson pre "$PRERELEASE" \
            '{tag_name:$tag, name:$name, draft:$draft, prerelease:$pre}')
          RESPONSE=$(curl -fsSL -X POST \
            --connect-timeout 10 \
            --max-time 60 \
            -H "Authorization: token $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$BODY" \
            "https://api.github.com/repos/$GITHUB_MIRROR_REPOSITORY/releases")
          GITHUB_RELEASE_ID=$(echo "$RESPONSE" | jq -er '.id | select(type == "number")')
          echo "GitHub release created: id=$GITHUB_RELEASE_ID"

          shopt -s nullglob
          assets=(assets/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets were staged for the GitHub mirror."
            exit 1
          fi
          for asset in "${assets[@]}"; do
            echo "Uploading $asset to GitHub"
            curl -fsSL -X POST \
              --connect-timeout 10 \
              --max-time 300 \
              -H "Authorization: token $GITHUB_RELEASE_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/zip" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary "@$asset" \
              "https://uploads.github.com/repos/$GITHUB_MIRROR_REPOSITORY/releases/${GITHUB_RELEASE_ID}/assets?name=$(basename "$asset")"
          done

      - name: Smoke cleanup (PR only)
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          CI_GITEA_TOKEN: ${{ secrets.CI_GITEA_TOKEN }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Deleting smoke release $RELEASE_ID"
            curl -fsSL -X DELETE \
              -H "Authorization: token $CI_GITEA_TOKEN" \
              "https://gitea.llamabox.sticktoitive.net/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" || true
          fi
          if [ -n "$TAG" ]; then
            echo "Deleting smoke tag $TAG"
            curl -fsSL -X DELETE \
              -H "Authorization: token $CI_GITEA_TOKEN" \
              "https://gitea.llamabox.sticktoitive.net/api/v1/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" || true
          fi
