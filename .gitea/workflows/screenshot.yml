name: Screenshot

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  screenshot:
    name: Capture Avalonia screenshot
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build MFTLib (native + managed)
        shell: bash
        run: bash ci/gates.sh native

      - name: Restore dependencies
        run: dotnet restore git-wizard.slnx

      - name: Build GitWizardUI
        run: dotnet build GitWizardUI/GitWizardUI.csproj -c Release --no-restore

      - name: Capture screenshot (Avalonia headless)
        shell: pwsh
        timeout-minutes: 10
        run: pwsh -NoProfile -NonInteractive -File scripts/update-screenshots.ps1 -Configuration Release -OutputPath Screenshots/GitWizardUI.png -TimeoutSeconds 180

      - name: Upload screenshot artifact
        if: always()
        # Gitea-native action: actions/upload-artifact uploads are not listed by
        # the artifacts REST API that reviews read.
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: GitWizardUI-screenshot
          path: Screenshots/GitWizardUI.png
          if-no-files-found: error
          retention-days: 30
